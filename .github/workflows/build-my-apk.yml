# Builds the Pixel (Mali/PowerVR system Vulkan) APK for this fork and attaches it to the run as a download.
# Run it from the Actions tab: "Build my APK" > Run workflow.
#
# Signing is optional. Without the secrets below the APK is signed with a throwaway debug key, which installs fine,
# but each new build then has to be uninstalled before installing the next one (your game files are kept).
# Add these secrets (Settings > Secrets and variables > Actions) so later builds install as updates:
#   RELEASE_KEYSTORE_BASE64  RELEASE_STORE_PASSWORD  RELEASE_KEY_ALIAS  RELEASE_KEY_PASSWORD
name: Build my APK

on:
  workflow_dispatch:
    inputs:
      pixel:
        description: Pixel build (system Mali/PowerVR Vulkan). Untick for the Snapdragon build.
        type: boolean
        default: true
      release:
        description: Publish the APK as a GitHub release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Fetch bundled components
        run: tools/fetch_components.sh

      - name: Remove 32-bit Windows files from Proton
        run: |
          command -v zstd > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd > /dev/null; }
          python3 tools/trim_proton_i386.py app/src/main/assets/bundled_components/proton-11.0-90624-arm64ec.wcp

      - name: Download LLVM-MinGW (ARM64 Windows compiler)
        env:
          LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
          LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
        run: |
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "MINGW_BIN=$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_ENV"

      - name: Build the browser-login helper
        if: hashFiles('tools/wow-session-bridge/build.sh') != ''
        run: |
          sh tools/wow-session-bridge/build.sh "$MINGW_BIN/aarch64-w64-mingw32-clang" \
            app/src/main/assets/wow-session-bridge.exe

      # The Pixel profiles load DXVK 2.4.1-wow-powervr, which is built from source rather than downloaded.
      - name: Build the Pixel DXVK
        if: inputs.pixel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build glslang-tools zstd > /dev/null
          git clone --quiet https://github.com/doitsujin/dxvk.git "$RUNNER_TEMP/dxvk"
          git -C "$RUNNER_TEMP/dxvk" checkout --quiet 0cf05780abd7250c2cd713b7749cf32180157cf5
          git -C "$RUNNER_TEMP/dxvk" submodule update --init --recursive --quiet
          bash tools/dxvk-powervr/build.sh "$RUNNER_TEMP/dxvk" "$MINGW_BIN"
          ls -l app/src/pixelTest/assets/bundled_components/

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets set, so this APK uses a throwaway debug key."
            exit 0
          fi
          mkdir -p app/keystores
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystores/release.jks
          {
            echo "storeFile=keystores/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystores/keystore.properties

      - name: Build
        env:
          PIXEL: ${{ inputs.pixel }}
        run: |
          ./gradlew --no-daemon -PforeverFork=true -PforeverPixelVulkanTest="$PIXEL" :app:assembleModernRelease
          cp app/build/outputs/apk/modern/release/app-modern-release.apk WoW-Forever-My-Build.apk

      - name: Remove signing files
        if: always()
        run: rm -rf app/keystores/release.jks app/keystores/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: WoW-Forever-My-Build
          path: WoW-Forever-My-Build.apk
          if-no-files-found: error

      - name: Publish the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          PIXEL: ${{ inputs.pixel }}
        run: |
          base=$(sed -n 's/.*pixelVulkanTestBuild) "\([^"]*\)" else.*/\1/p' app/build.gradle.kts | head -1)
          variant=$([ "$PIXEL" = "true" ] && echo "Pixel" || echo "Snapdragon")
          tag="my-build-${{ github.run_number }}"
          apk="WoW-Forever-My-Build-$variant.apk"
          mv WoW-Forever-My-Build.apk "$apk"
          gh release create "$tag" "$apk" --target "$(git rev-parse HEAD)" --latest \
            --title "WoW Forever (My Build) $variant #${{ github.run_number }}" \
            --notes "Based on bthginfo/wow-forever-mobile ${base:-unknown}. Adds a Hide on-screen controls switch (quick menu, opened with the back gesture) and lets the toolbar be minimised in every mode. Installs beside the official apps as \"WoW Forever (My Build)\". See FORK-CHANGES.md."
